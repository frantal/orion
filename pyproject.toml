[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orion"
version = "0.1.0"
description = "ORION — Autonomous Options Alpha Agent. The agent that has to prove its trade."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ORION Team" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "httpx>=0.26",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.setuptools.packages.find]
include = ["backend*"]
